<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Teacher Login – ScienceB3</title>
  <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" />
  <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.min.css" />
  <link rel="stylesheet" href="style.css" />
</head>
<body class="auth-page">

  <div class="auth-wrapper">
    <div class="auth-card">
      <a href="index.html" class="auth-logo">
        <span class="auth-logo-icon" style="background:var(--primary);">&#128300;</span>
        <span class="auth-logo-text">ScienceB3</span>
      </a>
      <span class="auth-role-badge">Teacher Portal</span>
      <h1>Welcome back</h1>
      <p class="auth-sub">Sign in to manage courses, quizzes, and student progress.</p>

      <form id="teacherLoginForm" novalidate>

        <div class="form-group">
          <label for="staffId">Staff ID or Email Address</label>
          <div class="input-icon-wrap">
            <i class="bi bi-person input-icon"></i>
            <input type="text" id="staffId" class="form-control-custom" placeholder="e.g. TCH-2024-001 or you@school.edu" autocomplete="username" required />
          </div>
        </div>

        <div class="form-group">
          <label for="password">
            Password
            <a href="#" style="float:right;font-size:0.78rem;color:var(--accent);text-decoration:none;font-weight:500;">Forgot password?</a>
          </label>
          <div class="input-icon-wrap" style="position:relative;">
            <i class="bi bi-lock input-icon"></i>
            <input type="password" id="password" class="form-control-custom" placeholder="Enter your password" autocomplete="current-password" required style="padding-right:44px;" />
            <button type="button" onclick="togglePwd('password','eyeT')" style="position:absolute;right:14px;top:50%;transform:translateY(-50%);background:none;border:none;cursor:pointer;color:var(--gray-400);">
              <i class="bi bi-eye" id="eyeT"></i>
            </button>
          </div>
        </div>

        <div class="d-flex align-items-center justify-content-between mb-4">
          <div class="form-check">
            <input class="form-check-input" type="checkbox" id="rememberMe" />
            <label class="form-check-label" for="rememberMe" style="font-size:0.85rem;color:var(--text-muted);">Keep me signed in</label>
          </div>
        </div>

        <div id="loginError" class="mb-3" style="display:none;background:rgba(192,57,43,0.08);border:1.5px solid var(--danger);border-radius:8px;padding:10px 14px;font-size:0.875rem;color:var(--danger);">
          <i class="bi bi-exclamation-circle me-2"></i>Invalid credentials. Please try again.
        </div>

        <button type="submit" class="btn-primary-custom btn-full">
          <i class="bi bi-box-arrow-in-right"></i> Sign In
        </button>

      </form>

      <div class="auth-divider">or</div>

      <div style="text-align:center;">
        <a href="student-login.html" style="font-size:0.875rem;color:var(--text-muted);text-decoration:none;">
          Are you a student? <span style="color:var(--accent);font-weight:600;">Student login</span>
        </a>
      </div>

      <div class="auth-footer-link" style="margin-top:16px;">
        <a href="index.html"><i class="bi bi-arrow-left me-1"></i>Back to main site</a>
      </div>
    </div>
  </div>

  <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
  <script>
    function togglePwd(inputId, iconId) {
      const inp = document.getElementById(inputId);
      const ico = document.getElementById(iconId);
      if (inp.type === 'password') { inp.type = 'text'; ico.className = 'bi bi-eye-slash'; }
      else { inp.type = 'password'; ico.className = 'bi bi-eye'; }
    }

    document.getElementById('teacherLoginForm').addEventListener('submit', function(e) {
      e.preventDefault();
      const id = document.getElementById('staffId').value.trim();
      const pw = document.getElementById('password').value;
      // Demo: accept any non-empty credentials for prototype
      if (id && pw) {
        window.location.href = 'teacher-portal.html';
      } else {
        document.getElementById('loginError').style.display = 'block';
      }
    });
  </script>
</body>
</html>
